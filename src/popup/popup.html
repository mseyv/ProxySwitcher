<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProxySwitcher Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            <path d="M2 12h20"></path>
          </svg>
        </div>
        <div class="brand-info">
          <h1>ProxySwitcher</h1>
          <span class="version">v1.0.0</span>
        </div>
      </div>
      <button id="btn-options" class="icon-btn" title="Settings" data-i18n-title="options_tooltip">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Active domain Quick Action -->
    <div id="domain-card" class="domain-card">
      <div class="domain-info">
        <span class="label" data-i18n="current_site_label">Текущий сайт:</span>
        <span id="current-domain" class="domain-name" data-i18n="loading">Загрузка...</span>
      </div>
      <div class="quick-rule-box">
        <select id="quick-target-profile" class="select-sm"></select>
        <button id="btn-add-rule" class="btn-primary-sm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span id="btn-add-rule-text" data-i18n="btn_add_rule">В правила</span>
        </button>
      </div>
    </div>

    <!-- Section Title -->
    <div class="section-header">
      <h2 data-i18n="section_profiles">Профили подключения</h2>
    </div>

    <!-- Profiles List -->
    <div id="profiles-list" class="profiles-list">
      <!-- Dynamically filled by popup.js -->
    </div>

    <!-- Footer -->
    <footer class="footer">
      <button id="btn-manage-profiles" class="footer-btn" data-i18n="footer_manage">
        Управление профилями и правилами &rarr;
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
